[project]
name = "rag"
version = "0.1.0"
description = "Notebook-first RAG learning repo with ingestion, retrieval, reranking, and evaluation examples"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.117.0",
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "datasets==3.6.0",
    "fastapi>=0.139.2",
    "feedparser>=6.0.12",
    "google-generativeai>=0.8.6",
    "gradio>=6.20.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "jupyter-dash>=0.4.2",
    "jupyterlab>=4.6.1",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.9",
    "langchain-openai>=1.3.5",
    "langchain-text-splitters>=1.1.2",
    "matplotlib>=3.11.1",
    "modal>=1.5.2",
    "numpy>=2.5.1",
    "ollama>=0.6.2",
    "openai>=2.46.0",
    "pandas>=3.0.3",
    "plotly>=6.9.0",
    "protobuf==3.20.2",
    "psutil>=7.2.2",
    "pydub>=0.25.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "sentence-transformers>=5.6.0",
    "setuptools>=83.0.0",
    "speedtest-cli>=2.1.3",
    "torch>=2.13.0",
    "tqdm>=4.69.0",
    "transformers>=5.14.1",
    "uvicorn[standard]>=0.51.0",
    "wandb>=0.25.0",
]

[project.scripts]
rag = "main:main"
